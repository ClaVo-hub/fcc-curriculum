<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown to HTML Converter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="theme-toggle-container">
      <button id="download-btn" type="button">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" x2="12" y1="15" y2="3" />
        </svg>
        Download
      </button>
      <button id="theme-btn" type="button">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
        Dark Mode
      </button>
    </div>
    <h1>Markdown to HTML Converter</h1>
    <div id="container">
      <div class="container">
        <h2>Markdown Input:</h2>
        <div class="pane-wrapper">
          <div id="counter-status">Words: 0 | Characters: 0</div>
          <textarea
            id="markdown-input"
            placeholder="Enter your markdown here..."
          ></textarea>
        </div>
      </div>
      <div class="container">
        <h2>Raw HTML Output:</h2>
        <div class="pane-wrapper">
          <button id="copy-btn" type="button">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
              <path
                d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"
              />
            </svg>
          </button>
          <div id="html-output"></div>
        </div>
      </div>
      <div class="container">
        <h2>HTML Preview:</h2>
        <div id="preview-wrapper" class="preview-wrapper">
          <button id="fs-btn" class="fullscreen-btn" type="button">
            ⛶ Fullscreen
          </button>
          <div id="preview"></div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
