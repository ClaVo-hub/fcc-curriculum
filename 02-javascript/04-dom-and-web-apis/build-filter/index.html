<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Student Instruments</h1>
    <main>
      <select class="select-container">
        <option value="all" id="all">All</option>
        <option value="woodwinds" id="woodwinds">Woodwinds</option>
        <option value="brass" id="brass">Brass</option>
        <option value="percussion" id="percussion">Percussion</option>
      </select>
      <div class="products-container">
        <div class="card">
          <h2>Flute</h2>
          <p>R6,500</p>
        </div>
        <div class="card">
          <h2>Clarinet</h2>
          <p>R3,800</p>
        </div>
        <div class="card">
          <h2>Oboe</h2>
          <p>R65,000</p>
        </div>
        <div class="card">
          <h2>Trumpet</h2>
          <p>R3,800</p>
        </div>
        <div class="card">
          <h2>Trombone</h2>
          <p>R5,700</p>
        </div>
        <div class="card">
          <h2>French Horn</h2>
          <p>R53,000</p>
        </div>

        <div class="card">
          <h2>Drum Set</h2>
          <p>R6,500</p>
        </div>
        <div class="card">
          <h2>Xylophone</h2>
          <p>R28,000</p>
        </div>
        <div class="card">
          <h2>Cymbals</h2>
          <p>R3,800</p>
        </div>
        <div class="card">
          <h2>Marimba</h2>
          <p>R32,000</p>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
