<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lighbox Viewer</title>
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <h1>Museum Gallery</h1>
    <div class="gallery">
      <img
        src="https://cdn.freecodecamp.org/curriculum/labs/stonehenge-thumbnail.jpg"
        alt="stonehenge painting"
        class="gallery-item"
      />
      <img
        src="https://cdn.freecodecamp.org/curriculum/labs/storm-thumbnail.jpg"
        alt="storm painting"
        class="gallery-item"
      />
      <img
        src="https://cdn.freecodecamp.org/curriculum/labs/trees-thumbnail.jpg"
        alt="trees painting"
        class="gallery-item"
      />
    </div>
    <div id="lightbox" class="lightbox">
      <button id="close-btn" class="close-btn">&times;</button>
      <img id="lightbox-img" src="" alt="Lightbox Image" />
    </div>
    <script src="script.js"></script>
  </body>
</html>
