<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom HTMLMediaElement Video Player</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="player-card" id="player-card">
      <div class="track-header">
        <div class="track-title">
          <span class="status-dot" id="status-dot"></span>
          <h2>Video Practice. HTMLMediaEl API</h2>
        </div>
        <span class="track-meta" id="meta-badge">Video • 1x</span>
      </div>

      <div class="video-container">
        <video
          id="video-track"
          src="https://upload.wikimedia.org/wikipedia/commons/d/da/Cat_playing_with_a_round_track_toy.webm?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
          playsinline
        ></video>
      </div>

      <div class="progress-section">
        <span id="current-time">0:00</span>
        <input
          type="range"
          id="seek-slider"
          min="0"
          max="100"
          step="0.1"
          value="0"
        />
        <span id="total-duration">0:00</span>
      </div>

      <div class="controls-row">
        <button id="rewind-btn" class="pill-btn" title="Rewind 5s">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="11 17 6 12 11 7"></polyline>
            <polyline points="18 17 13 12 18 7"></polyline>
          </svg>
          <span>5s</span>
        </button>

        <button
          id="play-pause-btn"
          class="round-play-btn"
          aria-label="Play or Pause"
        >
          <svg viewBox="0 0 24 24" fill="currentColor">
            <polygon points="7 4 20 12 7 20 7 4"></polygon>
          </svg>
        </button>

        <button id="stop-btn" class="circle-btn" title="Stop" aria-label="Stop">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <rect x="7" y="7" width="10" height="10" rx="1.5"></rect>
          </svg>
        </button>

        <button id="forward-btn" class="pill-btn" title="Forward 5s">
          <span>5s</span>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="13 17 18 12 13 7"></polyline>
            <polyline points="6 17 11 12 6 7"></polyline>
          </svg>
        </button>
      </div>

      <div class="volume-row">
        <button id="mute-btn" class="icon-only-btn" aria-label="Mute or Unmute">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </button>
        <input
          type="range"
          id="volume-slider"
          min="0"
          max="1"
          step="0.01"
          value="1"
        />
        <span id="volume-pct" class="volume-pct">100%</span>

        <button
          id="fullscreen-btn"
          class="icon-only-btn"
          title="Fullscreen"
          aria-label="Toggle Fullscreen"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
        </button>
      </div>

      <div class="speed-section">
        <span class="speed-label">Playback Speed</span>
        <div class="speed-group">
          <button class="speed-option" data-speed="0.75">0.75x</button>
          <button class="speed-option active" data-speed="1">1x</button>
          <button class="speed-option" data-speed="1.5">1.5x</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
