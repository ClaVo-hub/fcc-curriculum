<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="player-card" id="player-card">
        <div class="track-header">
          <div class="track-title">
            <span class="status-dot" id="status-dot"></span>
            <h2>Music Player</h2>
          </div>
          <span class="track-meta" id="meta-badge">Audio Controls</span>
        </div>

        <div class="now-playing-container">
          <div id="player-album-art">
            <img
              id="album-img"
              src="./images/bad-at-love.png"
              alt="song cover art"
            />
          </div>
          <div class="player-display-song-artist">
            <p id="player-song-title"></p>
            <p id="player-song-artist"></p>
          </div>
        </div>

        <div class="progress-section">
          <span id="current-time">0:00</span>
          <input
            type="range"
            id="seek-slider"
            min="0"
            max="100"
            step="0.1"
            value="0"
            aria-label="Seek"
          />
          <span id="total-duration">0:00</span>
        </div>

        <div class="controls-row">
          <button id="rewind-btn" class="pill-btn" title="Rewind 5s">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="11 17 6 12 11 7"></polyline>
              <polyline points="18 17 13 12 18 7"></polyline>
            </svg>
            <span>5s</span>
          </button>

          <button
            id="previous"
            class="circle-btn"
            title="Previous"
            aria-label="Previous"
          >
            <svg viewBox="0 0 24 24" fill="currentColor">
              <polygon points="19 20 9 12 19 4 19 20"></polygon>
              <rect x="5" y="4" width="2.5" height="16" rx="1"></rect>
            </svg>
          </button>

          <button id="play" class="round-play-btn" aria-label="Play">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <polygon points="7 4 20 12 7 20 7 4"></polygon>
            </svg>
          </button>

          <button
            id="stop-btn"
            class="circle-btn"
            title="Stop"
            aria-label="Stop"
          >
            <svg viewBox="0 0 24 24" fill="currentColor">
              <rect x="7" y="7" width="10" height="10" rx="1.5"></rect>
            </svg>
          </button>

          <button id="next" class="circle-btn" title="Next" aria-label="Next">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 4 15 12 5 20 5 4"></polygon>
              <rect x="16.5" y="4" width="2.5" height="16" rx="1"></rect>
            </svg>
          </button>

          <button id="forward-btn" class="pill-btn" title="Forward 5s">
            <span>5s</span>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="13 17 18 12 13 7"></polyline>
              <polyline points="6 17 11 12 6 7"></polyline>
            </svg>
          </button>
        </div>

        <div class="volume-row">
          <button
            id="mute-btn"
            class="icon-only-btn"
            aria-label="Mute or Unmute"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
          </button>
          <input
            type="range"
            id="volume-slider"
            min="0"
            max="1"
            step="0.01"
            value="1"
            aria-label="Volume"
          />
          <span id="volume-pct" class="volume-pct">100%</span>
        </div>
      </div>

      <div class="player-card playlist-card">
        <div class="track-header playlist-header">
          <div class="track-title">
            <h2 id="playlist">Playlist</h2>
          </div>
          <span class="track-meta">5 tracks</span>
        </div>

        <ul id="playlist-songs">
          <li id="song-0" class="playlist-song">
            <button class="playlist-song-info">
              <span class="playlist-song-title">Bad at Love</span>
              <span class="playlist-song-artist">Halsey</span>
              <span class="playlist-song-duration">3:01</span>
            </button>
          </li>

          <li id="song-1" class="playlist-song">
            <button class="playlist-song-info">
              <span class="playlist-song-title">Someone you Loved</span>
              <span class="playlist-song-artist">Conor Maynard</span>
              <span class="playlist-song-duration">2:28</span>
            </button>
          </li>

          <li id="song-2" class="playlist-song">
            <button class="playlist-song-info">
              <span class="playlist-song-title">Dangerous Woman</span>
              <span class="playlist-song-artist">Ariana Grande</span>
              <span class="playlist-song-duration">3:56</span>
            </button>
          </li>

          <li id="song-3" class="playlist-song">
            <button class="playlist-song-info">
              <span class="playlist-song-title">Lost Control</span>
              <span class="playlist-song-artist">Alan Walker</span>
              <span class="playlist-song-duration">3:42</span>
            </button>
          </li>

          <li id="song-4" class="playlist-song">
            <button class="playlist-song-info">
              <span class="playlist-song-title">
                A River Flows In You (remix)
              </span>
              <span class="playlist-song-artist">Yiruma</span>
              <span class="playlist-song-duration">6:40</span>
            </button>
          </li>
        </ul>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
