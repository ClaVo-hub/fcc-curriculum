<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="vieport" content="width=device-width, initial-scale=1.0" />
    <title>RegEx Sandbox</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <h1>Regex sandbox</h1>
    <main>
      <div id="regex-container">
        <label for="pattern"
          >Regex Pattern:
          <div id="pattern-container">
            /<input
              type="text"
              id="pattern"
              name="pattern"
              placeholder="Enter your regex pattern"
            />/
          </div>
        </label>

        <div id="flags-container">
          <p>Flags:</p>
          <label for="i">
            <input type="checkbox" id="i" name="flags" /> i
          </label>
          <label for="g">
            <input type="checkbox" id="g" name="flags" /> g
          </label>
        </div>
      </div>
      <div id="test-container">
        <p>Test String:</p>
        <div
          id="test-string"
          placeholder="Enter your test string"
          contenteditable="true"
        ></div>
      </div>
      <button class="btn" id="test-btn" type="button">Test Regex</button>
      <div id="result-container">
        <h2>Result:</h2>
        <p id="result"></p>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
