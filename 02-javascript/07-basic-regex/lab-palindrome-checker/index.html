<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Palindrome Checker</title>
    <link href="style.css" rel="stylesheet" />
  </head>

  <body>
    <h1>Is it a Palindrome?</h1>
    <div class="container">
      <div class="input-card">
        <p class="input-label">Enter in text to check for a palindrome:</p>
        <input type="text" id="text-input" value="" class="input" />
        <button id="check-btn" class="btn">Check</button>
        <p id="result"></p>
      </div>
      <div class="info-card">
        <p id="info-msg">
          💡 A <i>palindrome</i> is a word or sentence that's spelled the same
          way both forward and backward, ignoring punctuation, case, and
          spacing.
        </p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
